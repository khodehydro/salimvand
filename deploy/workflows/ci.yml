name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @salimvand/shared build

      - name: Run unit & integration tests
        run: pnpm -r test

      - name: Build Admin Panel
        run: pnpm --filter @salimvand/admin build

      - name: Build Website
        run: pnpm --filter @salimvand/website build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PUBLIC_SITE_URL: https://salimvand.ir
