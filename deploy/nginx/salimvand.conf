# Certbot can add the HTTPS redirect and certificate blocks in-place.
# Keep mail/MX/SPF/DKIM/DMARC records outside this file.

# Compress proxied responses — the API and website are reverse-proxied, and
# gzip_proxied is mandatory: nginx skips compression for proxied responses
# unless it is enabled explicitly. Persian JSON payloads shrink 80-90%.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json application/javascript application/xml text/css text/plain text/xml image/svg+xml;

# Persistent upstream connections: without an upstream block with keepalive,
# nginx opens a fresh TCP connection to the app for every single request.
# No WebSockets/SSE exist in this stack, so the connection header is emptied
# instead of the old hardcoded "upgrade".
upstream salimvand_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream salimvand_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name salimvand.ir www.salimvand.ir;
    client_max_body_size 2m;
    location /uploads/ {
        alias /opt/salimvand/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        proxy_pass http://salimvand_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cms.salimvand.ir;
    root /opt/salimvand/apps/admin/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Uploaded media (product images, logo, favicon) — the media library and
    # settings previews load them with the same relative /uploads/ paths the
    # storefront uses, so the CMS must serve them too.
    location ^~ /uploads/ {
        alias /opt/salimvand/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://salimvand_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # The panel is staff-only: serve a real robots.txt so crawlers don't get
    # the SPA login page (the / fallback answers every path with index.html).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-Agent: *\nDisallow: /\n";
    }
    # The SPA shell must always be revalidated: assets are content-hashed,
    # but a stale index.html keeps loading the previous release after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|svg|png|jpg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}

server {
    listen 80;
    server_name api.salimvand.ir;
    client_max_body_size 20m;
    location / {
        proxy_pass http://salimvand_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
